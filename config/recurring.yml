# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Sign-in sessions expire in the app (Session.active hides past rows),
  # but only this sweep removes them, so without it expired rows - each
  # carrying an IP address and user agent - accumulate forever. Same
  # query as `rake sessions:purge`; see lib/tasks/sessions.rake.
  purge_expired_sessions:
    command: "Session.expired.delete_all"
    schedule: daily
