# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Sign-in sessions expire in the app (Session.active hides past rows),
  # but only this sweep removes them, so without it expired rows - each
  # carrying an IP address and user agent - accumulate forever. Same
  # query as `rake sessions:purge`; see lib/tasks/sessions.rake.
  purge_expired_sessions:
    command: "Session.expired.delete_all"
    # Must parse to a Fugit::Cron: solid_queue's ensure_schedule_supported
    # rejects anything else, and bare `daily` parses to nil - only
    # "every day"-style phrasings or explicit cron resolve. A rejected
    # schedule is fatal at boot, not a warning (see
    # test/config/recurring_schedule_test.rb, which exists because `daily`
    # shipped once and crash-looped prod with SOLID_QUEUE_IN_PUMA).
    # No zone in the string, so SolidQueue's default (UTC) applies: 03:00
    # UTC is 06:00 in the app's Istanbul zone, clear of the low-traffic
    # evening hours.
    schedule: every day at 3am
